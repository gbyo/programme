name: Programme
options:
  bundleIdPrefix: org.programme
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top

packages:
  ProgrammeKit:
    path: Packages/ProgrammeKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GENERATE_INFOPLIST_FILE: "NO"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"

targets:
  Programme:
    type: application
    platform: iOS
    sources:
      - path: App/Programme
    dependencies:
      - package: ProgrammeKit
        products: [ProgrammeCore, ProgrammePersistence, ProgrammeExport, ProgrammeUI]
      - target: ProgrammeWidgets
    # CloudKit container for team collaboration. Provisioning the
    # iCloud.org.programme.Programme container in the Developer Portal and
    # enabling the Xcode iCloud capability is still required before any
    # device syncs; until then the coordinator reports unavailable and all
    # local behavior is unchanged.
    entitlements:
      path: App/Programme/Programme.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.programme.Programme
        PRODUCT_NAME: Programme
        INFOPLIST_FILE: App/Programme/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        # StateReporting ships in iOS 27+ only; weak-link so the app still
        # launches on the 26 deployment target (all use is availability-gated).
        OTHER_LDFLAGS: $(inherited) -weak_framework StateReporting

  ProgrammeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/ProgrammeWidgets
    dependencies:
      - package: ProgrammeKit
        products: [ProgrammeCore, ProgrammePersistence, ProgrammeUI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.programme.Programme.Widgets
        PRODUCT_NAME: ProgrammeWidgets
        INFOPLIST_FILE: App/ProgrammeWidgets/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"

  ProgrammeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/ProgrammeUITests
    dependencies:
      - target: Programme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.programme.Programme.UITests
        TEST_TARGET_NAME: Programme
        GENERATE_INFOPLIST_FILE: "YES"

  ProgrammeIntentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/ProgrammeIntentTests
    dependencies:
      - target: Programme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.programme.Programme.IntentTests
        TEST_TARGET_NAME: Programme
        GENERATE_INFOPLIST_FILE: "YES"
        FRAMEWORK_SEARCH_PATHS: $(SDKROOT)/Developer/Library/Frameworks

schemes:
  Programme:
    build:
      targets:
        Programme: all
        ProgrammeWidgets: all
        ProgrammeUITests: [test]
        ProgrammeIntentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProgrammeUITests
        - ProgrammeIntentTests
