name: Programme
options:
  bundleIdPrefix: com.gbyo.Programme
  # Keep the generated project's upgrade marker aligned with the Xcode version
  # Programme is developed with so Xcode doesn't repeatedly offer generated
  # "recommended settings" changes that can't be committed.
  xcodeVersion: "27.1"
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  groupSortPosition: top

packages:
  ProgrammeKit:
    path: Packages/ProgrammeKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # Automatic signing must remain profile-agnostic. Explicitly blank both
    # manual profile selectors so a regenerated project cannot retain a local
    # .mobileprovision UUID or path from Xcode user state.
    PROVISIONING_PROFILE: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    # Programme is owned and signed by the gbyo Apple Developer team.
    # Keeping this in the XcodeGen source of truth prevents regenerated
    # projects from losing the team selection before physical-device runs.
    DEVELOPMENT_TEAM: 57CW34C9J4
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GENERATE_INFOPLIST_FILE: "NO"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"

targets:
  Programme:
    type: application
    platform: iOS
    sources:
      - path: App/Programme
    dependencies:
      - package: ProgrammeKit
        products: [ProgrammeCore, ProgrammePersistence, ProgrammeExport, ProgrammeUI, ProgrammeCollaboration]
      - target: ProgrammeWidgets
      - target: ProgrammeWatch
      - target: ProgrammeThumbnails
    # CloudKit container for team collaboration, declared in
    # App/Programme/Programme.entitlements. Still required as external
    # steps before any device syncs: provision the
    # iCloud.com.gbyo.programme container in the Developer Portal,
    # and enable the Xcode iCloud + Push Notifications capabilities
    # (Xcode writes aps-environment itself at signing time; it is never
    # hard-coded here). Until then sync reports unavailable and all local
    # behavior is unchanged.
    # The App Group below must also be registered in the Developer Portal
    # (or let automatic signing create it) so the widget extension can
    # read the snapshot Programme writes via ProgrammeSharedContainer.
    entitlements:
      path: App/Programme/Programme.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.gbyo.programme
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.gbyo.programme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbyo.Programme
        PRODUCT_NAME: Programme
        INFOPLIST_FILE: App/Programme/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        # StateReporting ships in iOS 27+ only; weak-link so the app still
        # launches on the 26 deployment target (all use is availability-gated).
        OTHER_LDFLAGS: $(inherited) -weak_framework StateReporting

  ProgrammeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/ProgrammeWidgets
    dependencies:
      - package: ProgrammeKit
        products: [ProgrammeCore, ProgrammePersistence, ProgrammeUI]
    # Shared snapshot container, declared in
    # App/ProgrammeWidgets/ProgrammeWidgets.entitlements. Must match the
    # App Group on the Programme target so the widget extension can read
    # the snapshot the app writes via ProgrammeSharedContainer.
    entitlements:
      path: App/ProgrammeWidgets/ProgrammeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gbyo.programme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbyo.Programme.widgets
        PRODUCT_NAME: ProgrammeWidgets
        INFOPLIST_FILE: App/ProgrammeWidgets/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"

  ProgrammeWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/ProgrammeWatch
    dependencies:
      - package: ProgrammeKit
        products: [ProgrammeCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbyo.Programme.watchkitapp
        PRODUCT_NAME: ProgrammeWatch
        INFOPLIST_FILE: App/ProgrammeWatch/Info.plist
        SKIP_INSTALL: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"

  ProgrammeThumbnails:
    type: app-extension
    platform: iOS
    sources:
      - path: App/ProgrammeThumbnails
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbyo.Programme.thumbnails
        PRODUCT_NAME: ProgrammeThumbnails
        INFOPLIST_FILE: App/ProgrammeThumbnails/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"

  ProgrammeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/ProgrammeUITests
    dependencies:
      - target: Programme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbyo.Programme.uitests
        TEST_TARGET_NAME: Programme
        GENERATE_INFOPLIST_FILE: "YES"
        FRAMEWORK_SEARCH_PATHS: $(SDKROOT)/Developer/Library/Frameworks

  ProgrammeIntentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/ProgrammeIntentTests
    dependencies:
      - target: Programme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbyo.Programme.intenttests
        TEST_TARGET_NAME: Programme
        GENERATE_INFOPLIST_FILE: "YES"
        FRAMEWORK_SEARCH_PATHS: $(SDKROOT)/Developer/Library/Frameworks

schemes:
  Programme:
    build:
      targets:
        Programme: all
        ProgrammeWidgets: all
        ProgrammeWatch: all
        ProgrammeThumbnails: all
        ProgrammeUITests: [test]
        ProgrammeIntentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ProgrammeUITests
          # XCTest distributes parallel UI tests at the class level, so the
          # iPad coverage lives in several small XCTestCase classes that can
          # run concurrently across simulator clones.
          parallelizable: true
        - ProgrammeIntentTests
  ProgrammeWatch:
    build:
      targets:
        ProgrammeWatch: all
